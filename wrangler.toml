name = "biokeawebsite"
compatibility_date = "2026-04-18"

# Astro's Cloudflare adapter emits the worker entry + static assets;
# wrangler deploy picks them up from dist/ via `astro build`.

[vars]
CONTACT_FROM_EMAIL = "notifications@biokea.ai"
CONTACT_TO_EMAIL = "contact@biokea.ai"

# Shared Supabase project (xkmfsxcaapyuxachtcsy) for game leaderboards
# and the /api/subscribe endpoint. The publishable anon key is *meant*
# to be public — it's already baked into every game's JS bundle and
# the games.biokea.ai leaderboard (BioKEA/games-site) — so it lives in plain
# vars, not secrets. RLS on each table enforces what anonymous can do
# (insert into scores + subscribers, no select on subscribers).
SUPABASE_URL = "https://xkmfsxcaapyuxachtcsy.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_HmeteofpCTVchDfmzrMAxg_y0ea1IM1"

# Secrets — set once per environment:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put TURNSTILE_SECRET_KEY   # optional; enables captcha
#
# If TURNSTILE_SECRET_KEY is unset, the contact + subscribe endpoints
# skip captcha verification. Pair it with PUBLIC_TURNSTILE_SITE_KEY at
# build time so the widget renders on those pages. /api/contact requires
# a token when the secret is set; /api/subscribe only verifies one if
# sent (the in-game opt-in from games.biokea.ai has no widget) and leans
# on the edge rate limit in docs/security/rate-limiting.md instead.
#
# Supabase service-role key — required by /api/quote and /quote/<token>.
# The `quotes` table has RLS enabled with zero policies, so both the write
# and the read must bypass RLS. Set with:
#
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#
# The Golden Sample 26 hunt closed 2026-07-07; its GOLDEN_WORDS and
# GOLDEN_HMAC_SECRET secrets are retired and can be deleted with
# `wrangler secret delete <name>`.
