name = "biokeawebsite"
compatibility_date = "2026-04-18"

# Astro's Cloudflare adapter emits the worker entry + static assets;
# wrangler deploy picks them up from dist/ via `astro build`.

[vars]
CONTACT_FROM_EMAIL = "notifications@biokea.ai"
CONTACT_TO_EMAIL = "contact@biokea.ai"

# Shared Supabase project (xkmfsxcaapyuxachtcsy) for game leaderboards
# and the /api/subscribe endpoint. The publishable anon key is *meant*
# to be public — it's already baked into every game's JS bundle and
# the /mission/games/ Game Leaderboard panel — so it lives in plain
# vars, not secrets. RLS on each table enforces what anonymous can do
# (insert into scores + subscribers, no select on subscribers).
SUPABASE_URL = "https://xkmfsxcaapyuxachtcsy.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_HmeteofpCTVchDfmzrMAxg_y0ea1IM1"

# Secrets — set once per environment:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put TURNSTILE_SECRET_KEY   # optional; enables captcha
#
# If TURNSTILE_SECRET_KEY is unset, the contact + subscribe endpoints
# skip captcha verification. Pair it with PUBLIC_TURNSTILE_SITE_KEY at
# build time so the widget renders on those pages.
#
# Golden Sample 26 hunt secrets — required for /api/golden-sample/*
# to function (otherwise the endpoints return 500 "Hunt is not
# configured"; the games' fetch will fail silently and no animation
# fires). Set with:
#
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#     # Used by the hunt APIs to read past `scores` for proof-of-
#     # progress validation + write to golden_sample_* tables. Anon
#     # key isn't enough — the hunt tables are RLS-locked with no
#     # public policies so the word vault stays opaque.
#
#   wrangler secret put GOLDEN_HMAC_SECRET
#     # 32+ byte random string. Used to sign tickets so screenshots of
#     # the in-game reveal can't be turned into someone else's
#     # redemption. Rotate it and every existing ticket invalidates.
#
#   wrangler secret put GOLDEN_WORDS
#     # JSON map of {gameId: word}. Six entries. NEVER commit this to
#     # source. Words live only here.
#     # See migrations/0004_golden_sample_hunt.sql for the canonical
#     # game-ids; src/lib/golden-sample/config.ts has the slot map.
